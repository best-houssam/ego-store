<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold-1: #c8973a; --gold-2: #e8c86a; --gold-3: #f7e4a0;
  --dark: #03020a; --white: #fdf8f0;
}
html, body { min-height: 100%; background: var(--dark); overflow-x: hidden; }

.bg-stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1px 1px at 10% 20%, rgba(232,200,106,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 55%, rgba(232,200,106,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 40%, rgba(232,200,106,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 20% 80%, rgba(232,200,106,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 65%, rgba(232,200,106,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 5%  50%, rgba(232,200,106,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 38% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 85%, rgba(232,200,106,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 65%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 95% 10%, rgba(232,200,106,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 100%);
}
.orb {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(180,130,30,0.09) 0%, transparent 70%);
  top: -100px; left: -100px;
  animation: orb-drift 14s ease-in-out infinite alternate;
}
@media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
@keyframes orb-drift { from{transform:translate(0,0)} to{transform:translate(25px,18px)} }

.page {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 70px 24px;
}

/* Crown */
.crown-wrap { margin-bottom: 26px; opacity:0; animation: reveal 1s ease 0.1s forwards; }
.crown-svg { width:52px; height:auto; filter:drop-shadow(0 0 10px rgba(232,200,106,0.55)); }

/* Profile */
.profile-wrap { margin-bottom: 18px; opacity:0; animation: reveal 1s ease 0.2s forwards; }
.profile-ring {
  width:88px; height:88px; border-radius:50%; padding:2px;
  background:linear-gradient(135deg,#8a6820,#e8c86a,#f7e4a0,#e8c86a,#8a6820);
  box-shadow:0 0 20px rgba(232,200,106,0.3);
  animation:ring-glow 3s ease-in-out infinite alternate;
}
@keyframes ring-glow { from{box-shadow:0 0 16px rgba(200,151,58,0.25)} to{box-shadow:0 0 30px rgba(232,200,106,0.5)} }
.profile-img {
  width:100%; height:100%; border-radius:50%; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg,#1c1508,#2a1f05);
}
.profile-avatar { width:72%; height:72%; }

/* Name */
.name-block { text-align:center; margin-bottom:28px; opacity:0; animation:reveal 1s ease 0.3s forwards; }
.name-sub { font-family:'Raleway',sans-serif; font-weight:100; font-size:9px; letter-spacing:0.55em; color:var(--gold-1); text-transform:uppercase; margin-bottom:10px; display:block; }
.name-main {
  font-family:'Cinzel',serif; font-weight:900;
  font-size: clamp(34px, 9vw, 100px);
  letter-spacing:0.18em; line-height:1; color:transparent;
  background:linear-gradient(135deg,#8a6820 0%,#c8973a 20%,#f7e4a0 40%,#e8c86a 50%,#f7e4a0 60%,#c8973a 80%,#8a6820 100%);
  background-size:200% 200%;
  -webkit-background-clip:text; background-clip:text;
  animation:shimmer 4s ease infinite;
}
@keyframes shimmer { 0%{background-position:200% 0%} 100%{background-position:-200% 0%} }

/* Divider */
.divider { display:flex; align-items:center; width:300px; max-width:100%; margin:0 auto 32px; opacity:0; animation:reveal 1s ease 0.4s forwards; }
.div-line { flex:1; height:1px; background:linear-gradient(to right,transparent,var(--gold-1)); }
.div-line.r { background:linear-gradient(to left,transparent,var(--gold-1)); }
.div-center { display:flex; align-items:center; gap:7px; padding:0 12px; }
.div-d { width:6px;height:6px; background:var(--gold-2); transform:rotate(45deg); box-shadow:0 0 8px rgba(232,200,106,0.8); }
.div-d-sm { width:3.5px;height:3.5px; background:var(--gold-1); transform:rotate(45deg); opacity:0.6; }

/* Cards */
.cards { display:flex; flex-direction:column; gap:10px; width:100%; max-width:440px; }
.card { position:relative; text-decoration:none; display:flex; align-items:center; overflow:hidden; opacity:0; animation:slide-up 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
.card:nth-child(1){animation-delay:0.5s}
.card:nth-child(2){animation-delay:0.63s}
.card:nth-child(3){animation-delay:0.76s}
.card:nth-child(4){animation-delay:0.89s}
.card:nth-child(5){animation-delay:1.02s}
.card:nth-child(6){animation-delay:1.15s}
.card:nth-child(7){animation-delay:1.28s}

/* WhatsApp featured */
.card.featured .card-inner { background:linear-gradient(135deg,rgba(37,211,102,0.05),rgba(37,211,102,0.02)); border-color:rgba(37,211,102,0.18); }
.card.featured .featured-badge { display:flex; }
.featured-badge { display:none; align-items:center; gap:5px; position:absolute; top:10px; right:14px; font-family:'Raleway',sans-serif; font-weight:300; font-size:8px; letter-spacing:0.22em; text-transform:uppercase; color:#25D366; }
.featured-dot { width:7px; height:7px; border-radius:50%; background:#25D366; box-shadow:0 0 8px rgba(37,211,102,0.9); animation:pulse-wa 2s ease-in-out infinite; }
.card.featured .card-icon { position:relative; }
.card.featured .card-icon::after {
  content:''; position:absolute; bottom:-2px; right:-2px;
  width:14px; height:14px; background:#25D366; border-radius:50%;
  border:2px solid var(--dark); box-shadow:0 0 10px rgba(37,211,102,0.9);
  animation:pulse-wa 2s ease-in-out infinite;
}
@keyframes pulse-wa { 0%,100%{box-shadow:0 0 7px rgba(37,211,102,0.7)} 50%{box-shadow:0 0 16px rgba(37,211,102,1)} }

.card-inner {
  width:100%; display:flex; align-items:center; gap:18px; padding:18px 22px;
  background:linear-gradient(135deg,rgba(255,255,255,0.022),rgba(255,255,255,0.008));
  border:1px solid rgba(200,151,58,0.11); position:relative;
  transition:background 0.4s, border-color 0.4s, transform 0.3s;
}
.card-inner::before,.card-inner::after { content:''; position:absolute; width:10px; height:10px; transition:all 0.35s; opacity:0; }
.card-inner::before { top:-1px;left:-1px; border-top:1px solid var(--gold-2); border-left:1px solid var(--gold-2); }
.card-inner::after  { bottom:-1px;right:-1px; border-bottom:1px solid var(--gold-2); border-right:1px solid var(--gold-2); }

@media (hover:hover) and (pointer:fine) {
  .card:hover .card-inner { background:linear-gradient(135deg,rgba(200,151,58,0.07),rgba(200,151,58,0.025)); border-color:rgba(200,151,58,0.32); transform:translateY(-2px); box-shadow:0 16px 50px rgba(0,0,0,0.45); }
  .card:hover .card-inner::before,.card:hover .card-inner::after { opacity:1; width:18px; height:18px; }
  .card:hover .card-icon  { transform:scale(1.08) rotate(-3deg); }
  .card:hover .card-handle{ color:var(--gold-3); }
  .card:hover .card-arrow { opacity:1; transform:translateX(0); }
}
.card:active .card-inner { background:linear-gradient(135deg,rgba(200,151,58,0.07),rgba(200,151,58,0.025)); border-color:rgba(200,151,58,0.32); }

.card-icon { width:44px; height:44px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform 0.35s cubic-bezier(0.16,1,0.3,1); overflow:hidden; }
.card-icon svg { width:22px; height:22px; display:block; }

.icon-wa   { background:#25D366; }
.icon-ig   { background:linear-gradient(135deg,#405de6,#833ab4,#e1306c,#f77737,#ffdc80); }
.icon-tt   { background:#010101; border:1px solid rgba(255,255,255,0.14); }

.icon-fb   { background:#1877F2; }

.card-text { flex:1; }
.card-platform { display:block; font-family:'Raleway',sans-serif; font-weight:200; font-size:8.5px; letter-spacing:0.32em; text-transform:uppercase; color:var(--gold-1); margin-bottom:3px; }
.card-handle   { display:block; font-family:'Playfair Display',serif; font-size:17px; color:var(--white); letter-spacing:0.04em; transition:color 0.3s; }

.card-arrow { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border:1px solid rgba(200,151,58,0.2); border-radius:50%; flex-shrink:0; opacity:0; transform:translateX(-8px); transition:all 0.35s; }
.card-arrow svg { width:12px; height:12px; stroke:var(--gold-2); }

/* Footer */

@keyframes pulse-d { 0%,100%{box-shadow:0 0 7px rgba(200,151,58,0.8)} 50%{box-shadow:0 0 16px rgba(232,200,106,1)} }
.footer-text { font-family:'Raleway',sans-serif; font-weight:100; font-size:8.5px; letter-spacing:0.45em; color:rgba(200,151,58,0.3); text-transform:uppercase; }

@keyframes reveal   { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slide-up { from{opacity:0;transform:translateY(24px)}  to{opacity:1;transform:translateY(0)} }

@media (max-width:480px) {
  @keyframes shimmer { 0%,100%{background-position:0% 0%} }
  .orb { display:none; }
}
</style>
</head>
