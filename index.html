<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOUSSAM</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;900&family=Raleway:wght@100;200;300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold-1: #c8973a; --gold-2: #e8c86a; --gold-3: #f7e4a0;
  --dark: #03020a; --white: #fdf8f0;
}
html, body { min-height: 100%; background: var(--dark); overflow-x: hidden; }

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 1; animation: orb-drift 14s ease-in-out infinite alternate; }
.orb-1 { width:500px;height:500px; background:radial-gradient(circle,rgba(180,130,30,0.13),transparent 70%); top:-150px;left:-150px; }
.orb-2 { width:400px;height:400px; background:radial-gradient(circle,rgba(120,60,180,0.08),transparent 70%); bottom:-100px;right:-100px; animation-delay:-7s; }
.orb-3 { width:280px;height:280px; background:radial-gradient(circle,rgba(200,151,58,0.07),transparent 70%); top:50%;left:50%;transform:translate(-50%,-50%); animation-delay:-3s; }
@keyframes orb-drift { from{transform:scale(1) translate(0,0)} to{transform:scale(1.18) translate(30px,20px)} }

.page {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 32px;
}

.crown-wrap { margin-bottom: 30px; opacity:0; animation: reveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.1s forwards; }
.crown-svg { width:58px; height:auto; filter:drop-shadow(0 0 14px rgba(232,200,106,0.65)); }

.profile-wrap { margin-bottom: 20px; opacity:0; animation: reveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.15s forwards; position:relative; }
.profile-ring { width:90px; height:90px; border-radius:50%; padding:2px; background:linear-gradient(135deg,#8a6820,#e8c86a,#f7e4a0,#e8c86a,#8a6820); box-shadow:0 0 24px rgba(232,200,106,0.35); animation:ring-glow 3s ease-in-out infinite alternate; }
@keyframes ring-glow { from{box-shadow:0 0 18px rgba(200,151,58,0.3)} to{box-shadow:0 0 36px rgba(232,200,106,0.6)} }
.profile-img { width:100%; height:100%; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#1a1020; }
.profile-img img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
.profile-status { position:absolute; bottom:3px; right:3px; width:14px; height:14px; background:#25D366; border-radius:50%; border:2px solid var(--dark); box-shadow:0 0 8px rgba(37,211,102,0.7); animation:status-pulse 2s ease-in-out infinite; }
@keyframes status-pulse { 0%,100%{box-shadow:0 0 8px rgba(37,211,102,0.7)} 50%{box-shadow:0 0 16px rgba(37,211,102,1)} }

.name-block { text-align:center; margin-bottom:8px; opacity:0; animation:reveal 1.4s cubic-bezier(0.16,1,0.3,1) 0.25s forwards; }
.name-sub { font-family:'Raleway',sans-serif; font-weight:100; font-size:10px; letter-spacing:0.6em; color:var(--gold-1); text-transform:uppercase; margin-bottom:12px; display:block; }
.name-main { font-family:'Cinzel',serif; font-weight:900; font-size:clamp(36px,10vw,110px); letter-spacing:0.18em; line-height:1; color:transparent; background:linear-gradient(135deg,#8a6820 0%,#c8973a 20%,#f7e4a0 40%,#e8c86a 50%,#f7e4a0 60%,#c8973a 80%,#8a6820 100%); background-size:200% 200%; -webkit-background-clip:text; background-clip:text; animation:shimmer 4s ease infinite; }
@keyframes shimmer { 0%{background-position:200% 0%} 100%{background-position:-200% 0%} }

.stats-bar { display:flex; gap:28px; align-items:center; margin-bottom:4px; opacity:0; animation:reveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
.stat { text-align:center; }
.stat-num { display:block; font-family:'Cinzel',serif; font-weight:600; font-size:14px; color:var(--gold-2); letter-spacing:0.05em; }
.stat-label { display:block; font-family:'Raleway',sans-serif; font-weight:200; font-size:8px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(200,151,58,0.5); margin-top:2px; }
.stat-sep { width:1px; height:28px; background:linear-gradient(to bottom,transparent,rgba(200,151,58,0.3),transparent); }

.divider { display:flex; align-items:center; width:320px; max-width:100%; margin:24px auto 36px; opacity:0; animation:reveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.5s forwards; }
.div-line { flex:1; height:1px; background:linear-gradient(to right,transparent,var(--gold-1)); }
.div-line.r { background:linear-gradient(to left,transparent,var(--gold-1)); }
.div-center { display:flex; align-items:center; gap:8px; padding:0 14px; }
.div-d { width:7px;height:7px; background:var(--gold-2); transform:rotate(45deg); box-shadow:0 0 10px rgba(232,200,106,0.8); }
.div-d-sm { width:4px;height:4px; background:var(--gold-1); transform:rotate(45deg); opacity:0.6; }

.cards { display:flex; flex-direction:column; gap:12px; width:100%; max-width:460px; }

.card { position:relative; text-decoration:none; display:flex; align-items:center; overflow:hidden; opacity:0; animation:slide-up 0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
.card:nth-child(1){animation-delay:0.65s} .card:nth-child(2){animation-delay:0.8s} .card:nth-child(3){animation-delay:0.95s} .card:nth-child(4){animation-delay:1.1s} .card:nth-child(5){animation-delay:1.25s}

.card.featured .card-inner { background:linear-gradient(135deg,rgba(37,211,102,0.06),rgba(37,211,102,0.02)); border-color:rgba(37,211,102,0.2); }
.card.featured:hover .card-inner { background:linear-gradient(135deg,rgba(37,211,102,0.12),rgba(37,211,102,0.04)); border-color:rgba(37,211,102,0.45); box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(37,211,102,0.08),inset 0 1px 0 rgba(37,211,102,0.15); }
.card.featured .featured-badge { display:flex; }
.featured-badge { display:none; align-items:center; gap:5px; position:absolute; top:10px; right:14px; font-family:'Raleway',sans-serif; font-weight:200; font-size:7.5px; letter-spacing:0.3em; text-transform:uppercase; color:#25D366; opacity:0.7; }
.featured-dot { width:4px; height:4px; border-radius:50%; background:#25D366; animation:status-pulse 2s ease-in-out infinite; }

.card-inner { width:100%; display:flex; align-items:center; gap:20px; padding:20px 24px; background:linear-gradient(135deg,rgba(255,255,255,0.025),rgba(255,255,255,0.01)); border:1px solid rgba(200,151,58,0.12); position:relative; transition:all 0.5s cubic-bezier(0.16,1,0.3,1); backdrop-filter:blur(6px); }
.card-inner::before,.card-inner::after { content:''; position:absolute; width:12px; height:12px; transition:all 0.4s ease; opacity:0; }
.card-inner::before { top:-1px;left:-1px; border-top:1px solid var(--gold-2); border-left:1px solid var(--gold-2); }
.card-inner::after { bottom:-1px;right:-1px; border-bottom:1px solid var(--gold-2); border-right:1px solid var(--gold-2); }
.card:hover .card-inner { background:linear-gradient(135deg,rgba(200,151,58,0.08),rgba(200,151,58,0.03)); border-color:rgba(200,151,58,0.35); transform:translateY(-2px); box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(200,151,58,0.06),inset 0 1px 0 rgba(232,200,106,0.1); }
.card:hover .card-inner::before,.card:hover .card-inner::after { opacity:1; width:20px; height:20px; }

.card-icon { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform 0.4s cubic-bezier(0.16,1,0.3,1); }
.card:hover .card-icon { transform:scale(1.1) rotate(-3deg); }
.card-icon svg { width:24px; height:24px; }
.icon-ig { background:linear-gradient(135deg,#405de6,#5851db,#833ab4,#c13584,#e1306c,#fd1d1d,#f56040,#f77737,#fcaf45,#ffdc80); }
.icon-fb { background:#1877F2; } .icon-yt { background:#FF0000; } .icon-wa { background:#25D366; } .icon-tt { background:#010101; border:1px solid rgba(255,255,255,0.15); }

.card-text { flex:1; }
.card-platform { display:block; font-family:'Raleway',sans-serif; font-weight:200; font-size:9px; letter-spacing:0.35em; text-transform:uppercase; color:var(--gold-1); margin-bottom:4px; }
.card-handle { display:block; font-family:'Playfair Display',serif; font-size:18px; font-weight:400; color:var(--white); letter-spacing:0.04em; transition:color 0.3s; }
.card:hover .card-handle { color:var(--gold-3); }
.card.featured:hover .card-handle { color:#7fffc4; }

.card-arrow { display:flex; align-items:center; justify-content:center; width:32px; height:32px; border:1px solid rgba(200,151,58,0.2); border-radius:50%; flex-shrink:0; opacity:0; transform:translateX(-10px); transition:all 0.4s cubic-bezier(0.16,1,0.3,1); }
.card:hover .card-arrow { opacity:1; transform:translateX(0); border-color:rgba(200,151,58,0.5); box-shadow:0 0 12px rgba(200,151,58,0.2); }
.card-arrow svg { width:13px; height:13px; stroke:var(--gold-2); }

.card-scan { position:absolute; inset:0; background:linear-gradient(to right,transparent,rgba(232,200,106,0.04),transparent); transform:translateX(-100%); transition:transform 0.7s ease; pointer-events:none; }
.card:hover .card-scan { transform:translateX(100%); }

.footer { margin-top:52px; text-align:center; opacity:0; animation:reveal 1s ease 1.5s forwards; }
.footer-diamonds { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; }
.fd { width:4px;height:4px; background:var(--gold-1); transform:rotate(45deg); opacity:0.3; }
.fd.active { opacity:1; box-shadow:0 0 8px rgba(200,151,58,0.8); animation:pulse-d 2s ease infinite; }
@keyframes pulse-d { 0%,100%{box-shadow:0 0 8px rgba(200,151,58,0.8)} 50%{box-shadow:0 0 18px rgba(232,200,106,1)} }
.footer-text { font-family:'Raleway',sans-serif; font-weight:100; font-size:9px; letter-spacing:0.5em; color:rgba(200,151,58,0.3); text-transform:uppercase; }

@keyframes reveal { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
@keyframes slide-up { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
